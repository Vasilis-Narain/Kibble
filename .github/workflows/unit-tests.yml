# Name of the workflow
name: Build and test

# define trigger event(s)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Unit tests and firmware build (Docker)
    steps:

      - name: Check out this repo
        uses: actions/checkout@v4

      # --network=host: on the ubuntu-26.04 runner, DNS fails from Docker's
      # default bridge network (apt and the CppUTest git clone need it)
      - name: Build Docker image
        run: docker build --network=host -t handheld-env -f Dockerfile .

      - name: Unit tests
        run: >
          docker run --rm --network=host -v "$PWD:/project" handheld-env sh -c
          "cmake --preset host-tests && cmake --build --preset host-tests && ctest --preset host-tests"

      - name: Firmware build
        run: >
          docker run --rm -v "$PWD:/project" handheld-env sh -c
          "cmake --preset Release && cmake --build --preset Release"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: handheld-firmware
          path: |
            build/Release/handheld.elf
            build/Release/handheld.map
