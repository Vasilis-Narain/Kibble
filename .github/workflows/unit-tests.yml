# Name of the workflow
name: Build and test

# define trigger event(s)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Unit tests and firmware build
    steps:

      - name: Check out this repo
        uses: actions/checkout@v4

      # Same packages as the Dockerfile (used for local runs). Installed on the
      # runner directly: apt inside docker build kept failing DNS on GitHub.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
          cmake --version | head -1
          arm-none-eabi-gcc --version | head -1

      - name: Unit tests
        run: cmake --preset host-tests && cmake --build --preset host-tests && ctest --preset host-tests

      - name: Firmware build
        run: cmake --preset Release && cmake --build --preset Release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: handheld-firmware
          path: |
            build/Release/handheld.elf
            build/Release/handheld.map
