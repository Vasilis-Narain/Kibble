# Name of the workflow
name: Build and test

# define trigger event(s)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Unit tests and firmware build (Docker)
    steps:

      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t handheld-env -f Dockerfile .

      - name: Unit tests
        run: >
          docker run --rm -v "$PWD:/project" handheld-env sh -c
          "cmake --preset host-tests && cmake --build --preset host-tests && ctest --preset host-tests"

      - name: Firmware build
        run: >
          docker run --rm -v "$PWD:/project" handheld-env sh -c
          "cmake --preset Release && cmake --build --preset Release"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: handheld-firmware
          path: |
            build/Release/handheld.elf
            build/Release/handheld.map
